<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Costra — Email Graphic</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0F0D10;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  canvas { border-radius: 14px; display: block; }
  button {
    background: #E8923A;
    color: #09080A;
    border: none;
    padding: 13px 38px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { opacity: 0.88; }
  .hint { font-size: 12px; color: #B0A090; }
</style>
</head>
<body>

<canvas id="c"></canvas>
<button onclick="download()">⬇&nbsp; Download PNG</button>
<span class="hint">600 × 280 px &nbsp;·&nbsp; email-ready</span>

<script>
const canvas = document.getElementById('c');
const DPR = 2;
const W = 600, H = 280;
canvas.width  = W * DPR;
canvas.height = H * DPR;
canvas.style.width  = W + 'px';
canvas.style.height = H + 'px';
const ctx = canvas.getContext('2d');
ctx.scale(DPR, DPR);

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}

function draw() {
  // ── Background ──
  ctx.fillStyle = '#09080A';
  rr(0, 0, W, H, 14);
  ctx.fill();

  ctx.save();
  rr(0, 0, W, H, 14);
  ctx.clip();

  // Ambient glow bottom-left
  const glow = ctx.createRadialGradient(30, H, 0, 30, H, 210);
  glow.addColorStop(0, 'rgba(232,146,58,0.13)');
  glow.addColorStop(1, 'rgba(232,146,58,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  // Top accent line
  const topLine = ctx.createLinearGradient(0, 0, W, 0);
  topLine.addColorStop(0,    'rgba(232,146,58,0)');
  topLine.addColorStop(0.5,  'rgba(232,146,58,0.45)');
  topLine.addColorStop(1,    'rgba(232,146,58,0)');
  ctx.fillStyle = topLine;
  ctx.fillRect(0, 0, W, 1);

  ctx.restore();

  // ── LEFT — Brand ──
  ctx.fillStyle = '#B0A090';
  ctx.font = '700 10px monospace';
  ctx.fillText('COSTRA', 32, 50);

  // ── LEFT — Hook ──
  ctx.font = 'bold 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';

  ctx.fillStyle = '#F4EDE2';
  ctx.fillText("You’re probably paying", 32, 108);
  ctx.fillText('for things you', 32, 136);

  // "forgot " in white, "exist." in yellow
  ctx.fillStyle = '#F4EDE2';
  ctx.fillText('forgot ', 32, 164);
  const fw = ctx.measureText('forgot ').width;
  ctx.fillStyle = '#F5C842';
  ctx.fillText('exist.', 32 + fw, 164);

  // ── LEFT — CTA button ──
  ctx.fillStyle = '#E8923A';
  rr(32, 194, 196, 34, 6);
  ctx.fill();

  ctx.fillStyle = '#09080A';
  ctx.font = 'bold 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
  ctx.fillText('Find What You’re Wasting →', 44, 216);

  // Tagline
  ctx.fillStyle = '#B0A090';
  ctx.font = '400 10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
  ctx.fillText('Your personal', 240, 207);
  ctx.fillText('savings concierge', 240, 221);

  // ── Vertical divider ──
  const vg = ctx.createLinearGradient(0, 54, 0, 226);
  vg.addColorStop(0,   'rgba(60,50,70,0)');
  vg.addColorStop(0.5, 'rgba(60,50,70,1)');
  vg.addColorStop(1,   'rgba(60,50,70,0)');
  ctx.strokeStyle = vg;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(392, 54);
  ctx.lineTo(392, 226);
  ctx.stroke();

  // ── RIGHT — Savings card ──
  const cx = 404, cy = 28, cw = 172, ch = 224;

  ctx.fillStyle = '#161318';
  rr(cx, cy, cw, ch, 10);
  ctx.fill();

  ctx.strokeStyle = '#252030';
  ctx.lineWidth = 1;
  rr(cx, cy, cw, ch, 10);
  ctx.stroke();

  // Card label
  ctx.fillStyle = '#B0A090';
  ctx.font = '700 8px monospace';
  ctx.fillText('SAVINGS FOUND', cx + 14, cy + 24);

  // Line items
  const items = [
    ['Streaming (unused)', '−$17'],
    ['Phone plan',         '−$54'],
    ['Cloud storage ×2', '−$23'],
  ];

  let iy = cy + 46;
  for (const [name, amt] of items) {
    ctx.fillStyle = '#7a6e65';
    ctx.font = '400 10.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.fillText(name, cx + 14, iy);

    ctx.fillStyle = '#F5C842';
    ctx.font = 'bold 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    const aw = ctx.measureText(amt).width;
    ctx.fillText(amt, cx + cw - 14 - aw, iy);

    iy += 22;
  }

  // Divider
  ctx.strokeStyle = '#252030';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx + 14, iy + 4);
  ctx.lineTo(cx + cw - 14, iy + 4);
  ctx.stroke();

  // Total label
  ctx.fillStyle = '#F4EDE2';
  ctx.font = 'bold 10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
  ctx.fillText('Found', cx + 14, iy + 26);

  // Total amount
  ctx.fillStyle = '#F5C842';
  ctx.font = 'bold 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
  const tw = ctx.measureText('$94/mo').width;
  ctx.fillText('$94/mo', cx + cw - 14 - tw, iy + 28);

  // Per year
  ctx.fillStyle = '#B0A090';
  ctx.font = '400 9px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
  const yw = ctx.measureText('$1,128/year').width;
  ctx.fillText('$1,128/year', cx + cw - 14 - yw, iy + 44);
}

draw();

function download() {
  const link = document.createElement('a');
  link.download = 'costra-email-header.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}
</script>

</body>
</html>
