<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Costra — Email Graphic</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0F0D10;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 40px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  /* ── Email graphic ── */
  #graphic {
    width: 600px;
    height: 280px;
    background: #09080A;
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    position: relative;
  }

  /* Ambient glow bottom-left */
  .glow {
    position: absolute;
    width: 260px;
    height: 260px;
    background: radial-gradient(circle, rgba(232,146,58,0.10) 0%, transparent 65%);
    bottom: -60px;
    left: -40px;
    pointer-events: none;
    z-index: 0;
  }

  /* Subtle top border accent */
  #graphic::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(232,146,58,0.4), transparent);
    z-index: 2;
  }

  /* ── Left panel ── */
  .left {
    flex: 1;
    padding: 32px 30px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    z-index: 1;
  }

  .brand {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #B0A090;
  }

  .hook {
    font-size: 23px;
    font-weight: 700;
    line-height: 1.35;
    color: #F4EDE2;
    flex: 1;
    display: flex;
    align-items: center;
    padding: 16px 0 12px;
  }

  .hook em {
    font-style: normal;
    color: #F5C842;
  }

  .bottom-row {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .cta-btn {
    background: #E8923A;
    color: #09080A;
    font-size: 11.5px;
    font-weight: 800;
    letter-spacing: 0.4px;
    padding: 10px 18px;
    border-radius: 6px;
    white-space: nowrap;
  }

  .tagline {
    font-size: 10px;
    color: #B0A090;
    line-height: 1.4;
  }

  /* ── Right panel ── */
  .right {
    width: 200px;
    padding: 22px 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 1;
  }

  /* Vertical divider */
  .right::before {
    content: '';
    position: absolute;
    left: 0; top: 20%; bottom: 20%;
    width: 1px;
    background: linear-gradient(180deg, transparent, #2a2530, transparent);
  }

  .savings-card {
    background: #161318;
    border: 1px solid #252030;
    border-radius: 10px;
    padding: 16px 15px;
    width: 100%;
  }

  .card-label {
    font-size: 8.5px;
    font-weight: 800;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: #B0A090;
    margin-bottom: 13px;
  }

  .line-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 9px;
  }

  .item-name {
    font-size: 10.5px;
    color: #7a6e65;
  }

  .item-saving {
    font-size: 11px;
    font-weight: 700;
    color: #F5C842;
  }

  .divider {
    border: none;
    border-top: 1px solid #252030;
    margin: 11px 0;
  }

  .total-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .total-label {
    font-size: 10px;
    font-weight: 700;
    color: #F4EDE2;
  }

  .total-amount {
    font-size: 18px;
    font-weight: 800;
    color: #F5C842;
    letter-spacing: -0.5px;
  }

  .per-year {
    font-size: 9px;
    color: #B0A090;
    text-align: right;
    margin-top: 3px;
  }

  /* ── Page controls ── */
  #download-btn {
    background: #E8923A;
    color: #09080A;
    border: none;
    padding: 13px 38px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    letter-spacing: 0.2px;
    font-family: inherit;
  }

  #download-btn:hover { opacity: 0.88; }
  #download-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .hint {
    font-size: 12px;
    color: #B0A090;
    letter-spacing: 0.3px;
  }
</style>
</head>
<body>

<div id="graphic">
  <div class="glow"></div>

  <div class="left">
    <div class="brand">Costra</div>

    <div class="hook">
      You're probably paying<br>
      for things you<br>
      <em>forgot exist.</em>
    </div>

    <div class="bottom-row">
      <div class="cta-btn">Find What You're Wasting →</div>
      <div class="tagline">Your personal<br>savings concierge</div>
    </div>
  </div>

  <div class="right">
    <div class="savings-card">
      <div class="card-label">Savings found</div>

      <div class="line-item">
        <span class="item-name">Streaming (unused)</span>
        <span class="item-saving">−$17</span>
      </div>
      <div class="line-item">
        <span class="item-name">Phone plan</span>
        <span class="item-saving">−$54</span>
      </div>
      <div class="line-item">
        <span class="item-name">Cloud storage ×2</span>
        <span class="item-saving">−$23</span>
      </div>

      <hr class="divider">

      <div class="total-row">
        <span class="total-label">Found</span>
        <span class="total-amount">$94/mo</span>
      </div>
      <div class="per-year">$1,128 saved per year</div>
    </div>
  </div>
</div>

<button id="download-btn" onclick="downloadGraphic()">⬇&nbsp; Download PNG</button>
<span class="hint">600 × 280 px &nbsp;·&nbsp; email-ready</span>

<script>
function downloadGraphic() {
  const btn = document.getElementById('download-btn');
  btn.textContent = 'Generating…';
  btn.disabled = true;

  html2canvas(document.getElementById('graphic'), {
    scale: 2,
    useCORS: true,
    backgroundColor: '#09080A',
    logging: false,
    borderRadius: 14
  }).then(canvas => {
    const link = document.createElement('a');
    link.download = 'costra-email-header.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    btn.innerHTML = '⬇&nbsp; Download PNG';
    btn.disabled = false;
  });
}
</script>

</body>
</html>
